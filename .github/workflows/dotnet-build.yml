name: .NET Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # Remove local-only nuget.config so CI doesn't pick up a developer's local package source
      - name: Remove local nuget.config
        run: |
          if [ -f "src/nuget.config" ]; then
            rm src/nuget.config
            echo "Removed src/nuget.config"
          else
            echo "src/nuget.config not present"
          fi
        shell: bash

      - name: Restore
        run: dotnet restore src/BlazorWorker.sln

      - name: Build
        run: dotnet build src/BlazorWorker.sln --configuration Debug --no-restore
